name: hydration
description: Drink and hydration tracker — mobile client for hydration-drink-ai.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Deliberately minimal. Anything needing a platform channel cannot be
  # exercised by `flutter test`, and untested plugin wiring is exactly the code
  # that looks right and does not run.
  http: ^1.2.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
